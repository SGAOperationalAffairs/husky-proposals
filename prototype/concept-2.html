<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Husky Proposals: Concept 2</title>
<style>
:root {
  color-scheme: light;
  --bg: #F1F2F5; --surface: #FFFFFF; --ink: #1A1D26; --muted: #596070; --line: #DADDE4;
  --accent: #C8102E; --accent-text: #C8102E; --on-accent: #FFFFFF;
  --accent-soft: color-mix(in srgb, var(--accent) 14%, var(--surface));
  --sky: #E3EBF7; --sky-ink: #26456F;
  --amber: #FFF0CF; --amber-ink: #74480A;
  --green: #DCF0E5; --green-ink: #17603B;
  --grey: #E8EAEF; --grey-ink: #424959;
  --focus: #1F5FBF;
  --font: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #13151A; --surface: #1C1F27; --ink: #ECEEF3; --muted: #A0A7B5; --line: #2D313C;
    --accent: #D52F47; --accent-text: #FF8696;
    --sky: #1F2E47; --sky-ink: #A9C6F2; --amber: #3A2D12; --amber-ink: #F0CB7D;
    --green: #153325; --green-ink: #92D7B2; --grey: #2A2E38; --grey-ink: #C4C9D4; --focus: #7AA7F0;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #13151A; --surface: #1C1F27; --ink: #ECEEF3; --muted: #A0A7B5; --line: #2D313C;
  --accent: #D52F47; --accent-text: #FF8696;
  --sky: #1F2E47; --sky-ink: #A9C6F2; --amber: #3A2D12; --amber-ink: #F0CB7D;
  --green: #153325; --green-ink: #92D7B2; --grey: #2A2E38; --grey-ink: #C4C9D4; --focus: #7AA7F0;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15.5px; line-height: 1.5; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.ic { width: 1.1em; height: 1.1em; flex: none; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 20px 56px; }

/* header */
.top { background: var(--surface); border: 1px solid var(--line); border-top: 5px solid var(--accent); margin-top: 16px; padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px 20px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; }
.mark { width: 40px; height: 40px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-weight: 800; font-size: .9rem; }
.brand b { display: block; line-height: 1.15; font-size: 1.1rem; }
.brand small { color: var(--muted); }
.who { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--line); background: var(--surface); flex-wrap: wrap; }
.seg button { appearance: none; border: 0; background: transparent; padding: 7px 13px; font-size: .9rem; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.sel { padding: 7px 10px; border: 1px solid var(--line); background: var(--surface); max-width: 100%; }
.btn { appearance: none; display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; font-weight: 500; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.line { border-color: var(--accent-text); color: var(--accent-text); background: transparent; }
.btn.sm { padding: 4px 10px; font-size: .85rem; }
.btn[aria-disabled="true"] { opacity: .55; }

/* tabs */
.tabs { position: relative; display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin: 14px 0 20px; overflow-x: auto; }
.tab { appearance: none; border: 0; background: transparent; padding: 11px 16px; border-bottom: 3px solid transparent; margin-bottom: -1px; font-weight: 500; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.tab[aria-selected="true"] { border-bottom-color: var(--accent); color: var(--accent-text); font-weight: 650; }
.badge { background: var(--accent); color: var(--on-accent); font-size: .75rem; font-weight: 700; min-width: 20px; height: 20px; padding: 0 6px; display: inline-grid; place-items: center; }
.badge.zero { background: var(--grey); color: var(--grey-ink); }

h2.pt { font-size: 1.6rem; line-height: 1.15; margin: 0 0 4px; letter-spacing: -0.01em; }
.sub { margin: 0 0 16px; color: var(--muted); max-width: 70ch; }
.box { background: var(--surface); border: 1px solid var(--line); }
.pad { padding: 16px 18px; }
.note { font-size: .86rem; color: var(--muted); margin: 8px 0 0; }

/* tags and chips */
.tg { display: inline-flex; align-items: center; gap: 5px; font-size: .78rem; font-weight: 600; padding: 1px 8px; background: var(--accent-soft); color: var(--accent-text); }
.mini { font-size: .78rem; color: var(--muted); border: 1px solid var(--line); padding: 0 7px; }
.mini.warn { color: var(--amber-ink); background: var(--amber); border-color: transparent; }
.mini.ok { color: var(--green-ink); background: var(--green); border-color: transparent; }
.mini.hot { color: var(--accent-text); border-color: var(--accent-text); }
.st { font-size: .78rem; font-weight: 600; padding: 2px 9px; white-space: nowrap; display: inline-block; }
.st-collecting { background: var(--grey); color: var(--grey-ink); }
.st-review { background: var(--sky); color: var(--sky-ink); }
.st-active { background: var(--amber); color: var(--amber-ink); }
.st-delivered { background: var(--green); color: var(--green-ink); }
.st-waiting { background: transparent; color: var(--grey-ink); border: 1px solid var(--line); }
.st-overdue { background: var(--accent-soft); color: var(--accent-text); }

/* queue */
.todo { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; margin-bottom: 14px; }
.todo-i { appearance: none; text-align: left; background: var(--surface); border: 1px solid var(--line); padding: 12px 14px; display: flex; align-items: center; gap: 12px; }
.todo-i:hover { border-color: var(--accent-text); }
.todo-i b { font-size: 1.8rem; line-height: 1; min-width: 34px; color: var(--accent-text); }
.todo-i span { font-size: .88rem; color: var(--muted); }
.bcards { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; margin-bottom: 18px; }
.bcard { appearance: none; text-align: left; background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--accent); padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.bcard[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--ink); }
.bcard b { font-size: 1rem; }
.bcard small { color: var(--muted); }
.pips { display: flex; gap: 4px; align-items: center; }
.pip { width: 22px; height: 10px; background: var(--line); }
.pip.on { background: var(--accent); }
.bact { font-size: .84rem; margin: 0; min-height: 1.3em; }
.tools { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; margin-bottom: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { appearance: none; border: 1px solid var(--line); background: var(--surface); padding: 5px 12px; font-size: .88rem; }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.search { flex: 1 1 180px; min-width: 0; padding: 7px 10px; border: 1px solid var(--line); background: var(--surface); }
.rows { background: var(--surface); border: 1px solid var(--line); }
.row, .rowh { display: grid; grid-template-columns: 44px minmax(0, 1fr) 118px 96px 78px 152px; gap: 12px; align-items: center; padding: 11px 14px; }
.rowh { font-size: .8rem; color: var(--muted); border-bottom: 1px solid var(--line); background: var(--bg); padding-top: 8px; padding-bottom: 8px; }
.row { appearance: none; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: transparent; }
.row:last-child { border-bottom: 0; }
.row:hover { background: var(--accent-soft); }
.row.hl { background: var(--accent-soft); }
.rk { font-weight: 700; color: var(--muted); }
.ti { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.ti b { font-weight: 650; }
.tags { display: flex; flex-wrap: wrap; gap: 5px; }
.nm b { font-size: 1.1rem; display: block; line-height: 1.2; }
.nm small { color: var(--muted); font-size: .8rem; }
.age { color: var(--muted); font-size: .88rem; }
.empty { padding: 28px; text-align: center; color: var(--muted); }

/* drawer */
.scrim { position: fixed; inset: 0; background: rgba(10, 12, 18, .5); z-index: 40; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(460px, 100%); background: var(--surface); border-left: 1px solid var(--line); z-index: 41; overflow: auto; padding: calc(18px + env(safe-area-inset-top, 0px)) 20px calc(24px + env(safe-area-inset-bottom, 0px)); }
.drawer h3 { margin: 6px 0 8px; font-size: 1.35rem; line-height: 1.2; }
.dhead { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0; }
.stats div { background: var(--bg); padding: 10px 8px; text-align: center; }
.stats b { display: block; font-size: 1.4rem; line-height: 1.1; }
.stats span { font-size: .78rem; color: var(--muted); }
.dsec { border-top: 1px solid var(--line); padding: 14px 0 4px; }
.dsec h4 { margin: 0 0 8px; font-size: .95rem; }
.stack { display: flex; flex-direction: column; gap: 8px; }
.inline { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.inline .sel { flex: 1 1 140px; min-width: 0; }
.chk { display: flex; align-items: center; gap: 8px; font-size: .92rem; }
.chk input { accent-color: var(--ink); width: 16px; height: 16px; margin: 0; }
.log { list-style: none; margin: 0; padding: 0; font-size: .9rem; }
.facts { margin: 10px 0 8px; font-size: .92rem; color: var(--muted); }
.facts b { color: var(--ink); font-size: 1rem; }
.dd { margin: 0 0 12px; color: var(--muted); display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; line-clamp: 3; overflow: hidden; }
.linkbtn { appearance: none; border: 0; background: none; padding: 0; color: var(--accent-text); text-decoration: underline; }
.dact { margin: 14px 0 4px; }
.bsum { margin: 0; font-size: .92rem; }
.log li { display: grid; grid-template-columns: 62px 1fr; gap: 8px; padding: 6px 0; border-top: 1px solid var(--line); }
.log time { color: var(--muted); }

/* forms */
.cols { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 18px; align-items: start; }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field.full { grid-column: 1 / -1; }
.field label { font-size: .85rem; font-weight: 600; }
.field input, .field select, .field textarea { padding: 9px 11px; border: 1px solid var(--line); background: var(--bg); width: 100%; }
.field textarea { min-height: 96px; resize: vertical; }
.hint { background: var(--amber); color: var(--amber-ink); padding: 10px 12px; font-size: .9rem; }
.pv { background: var(--surface); border: 1px solid var(--line); border-top: 5px solid var(--accent); padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.pv h4 { margin: 0; font-size: 1.1rem; line-height: 1.25; }
.pv p { margin: 0; color: var(--muted); font-size: .92rem; }
.pvh { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.pvl { font-size: .8rem; color: var(--muted); margin: 0 0 8px; }
.ledger { border: 1px solid var(--line); background: var(--surface); padding: 10px 12px; font-size: .92rem; }
.ledger time { color: var(--muted); margin-right: 10px; }
.notif { background: var(--ink); color: var(--bg); padding: 10px 12px; font-size: .88rem; }

/* updates list */
.ulist .urow { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.ulist .urow:last-child { border-bottom: 0; }
.urow[aria-current="true"] { background: var(--accent-soft); }

/* people */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
.tile { background: var(--surface); border: 1px solid var(--line); padding: 10px 14px; }
.tile b { font-size: 1.6rem; line-height: 1.1; display: block; }
.tile span { font-size: .84rem; color: var(--muted); }
.prow { display: grid; grid-template-columns: 26px 36px minmax(0, 1.1fr) minmax(0, 1.4fr) 150px 112px auto; gap: 12px; align-items: center; padding: 11px 14px; border-bottom: 1px solid var(--line); }
.prow:last-child { border-bottom: 0; }
.prow input { accent-color: var(--ink); width: 16px; height: 16px; }
.av { width: 34px; height: 34px; background: var(--accent-soft); color: var(--accent-text); display: grid; place-items: center; font-weight: 700; font-size: .85rem; }
.pi { display: flex; flex-direction: column; min-width: 0; }
.pi small, .pd small { color: var(--muted); font-size: .8rem; }
.pi small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pw { font-size: .9rem; min-width: 0; }
.pd { font-size: .88rem; }
.pa { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.bulk { position: sticky; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); margin-top: 12px; background: var(--ink); color: var(--bg); padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.bulk .btn { color: var(--ink); }

dialog { width: min(600px, 94vw); max-height: 92vh; overflow: auto; padding: 0; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
dialog::backdrop { background: rgba(10, 12, 18, .55); }
.dlg { padding: 20px; }
.dlg h3 { margin: 0 0 4px; font-size: 1.3rem; }
.dlg .sub { margin-bottom: 12px; }
.dlg-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
.optrow { padding: 12px 0; border-top: 1px solid var(--line); }
.optrow:first-of-type { border-top: 0; }
.optrow b { display: block; }
.optrow small { display: block; color: var(--muted); margin-bottom: 8px; }

/* filters that belong to the list */
.listbox { background: var(--surface); border: 1px solid var(--line); }
.listbox .rows { border: 0; border-top: 1px solid var(--line); }
.fbar { padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.fbar .search { width: 100%; flex: none; }
.fgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) auto; gap: 12px; align-items: end; }
.fld { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.fld span { font-size: .8rem; font-weight: 600; }
.fld select { padding: 7px 10px; border: 1px solid var(--line); background: var(--surface); width: 100%; }
.fld select:disabled { opacity: .75; background: var(--bg); }
.fld small { color: var(--muted); font-size: .76rem; }
.count { margin: 0; font-size: .9rem; color: var(--muted); padding-bottom: 20px; white-space: nowrap; }
.count b { color: var(--ink); font-size: 1.15rem; }
.fbar.slim { flex-direction: row; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
.fbar.slim .fld { flex: 1 1 150px; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (max-width: 860px) { .fgrid { grid-template-columns: 1fr 1fr; } .count { padding-bottom: 0; } }
@media (max-width: 560px) { .fgrid { grid-template-columns: 1fr; } }
/* ===== student side ===== */
.userchip { font-size: .85rem; color: var(--muted); border: 1px solid var(--line); padding: 6px 12px; background: var(--surface); }
.modenote { margin: 10px 0 0; font-size: .84rem; color: var(--muted); }
.s-compose { margin-left: auto; align-self: center; appearance: none; border: 0; background: var(--accent); color: var(--on-accent); padding: 8px 16px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.s-filters { display: grid; grid-template-columns: minmax(0, 1.4fr) repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 14px; align-items: end; }
.s-filters .search { width: 100%; flex: none; }
.s-feed { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr)); gap: 14px; align-items: start; }
.s-card { background: var(--surface); border: 1px solid var(--line); border-top: 5px solid var(--accent); display: flex; flex-direction: column; }
.s-chead { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 18px 18px 0; flex-wrap: wrap; }
.s-tags { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.s-num { font-size: .8rem; font-weight: 600; color: var(--muted); }
.s-cbody { padding: 12px 18px 18px; display: flex; flex-direction: column; gap: 9px; }
.s-title { margin: 0; font-size: 1.12rem; line-height: 1.25; font-weight: 650; }
.s-meta { display: flex; flex-wrap: wrap; gap: 3px 14px; font-size: .84rem; color: var(--muted); }
.s-meta span { display: inline-flex; align-items: center; gap: 5px; }
.s-desc { margin: 0; color: var(--muted); display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden; }
.s-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding-top: 10px; border-top: 1px solid var(--line); margin-top: 2px; }
.s-lm { appearance: none; display: inline-flex; align-items: center; gap: 6px; font-weight: 600; white-space: nowrap; border: 1px solid var(--accent-text); background: transparent; padding: 6px 14px; color: var(--accent-text); }
.s-lm:hover { background: var(--accent-soft); }
.s-final { font-size: .85rem; color: var(--muted); }
.s-vb { appearance: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 5px 12px; }
.s-vb[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.s-pair { display: inline-flex; width: 184px; max-width: 100%; }
.s-pair .s-vb { flex: 1 1 0; min-width: 0; }
.s-pair .s-vb + .s-vb { margin-left: -1px; }
.s-pair .s-vb[aria-pressed="true"] + .s-vb[aria-pressed="true"] { border-left-color: rgba(255, 255, 255, .6); }
.s-pair.big { display: flex; flex-direction: column; width: 100%; gap: 8px; }
.s-pair.big .s-vb { width: 100%; padding: 10px 20px; font-size: 1.02rem; }
.s-pair.big .s-vb + .s-vb { margin-left: 0; }
.s-pg { display: grid; grid-template-columns: minmax(0, 1fr) 310px; gap: 14px; align-items: start; }
.s-main, .s-side { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.s-side { position: sticky; top: 12px; }
.s-ph { background: var(--surface); border: 1px solid var(--line); border-top: 5px solid var(--accent); padding: 18px; display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
.s-back { appearance: none; align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; border: 0; background: transparent; padding: 0; color: var(--muted); }
.s-back:hover { color: var(--accent-text); text-decoration: underline; }
.s-h1 { margin: 0; font-size: clamp(1.5rem, 4vw, 2.1rem); line-height: 1.15; letter-spacing: -0.015em; }
.s-sec { background: var(--surface); border: 1px solid var(--line); padding: 18px; }
.s-sec h2 { margin: 0 0 10px; font-size: 1.05rem; }
.s-sec p { margin: 0 0 10px; }
.s-sec p:last-child { margin-bottom: 0; }
.s-dl { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px 16px; margin: 0; }
.s-dl dt { font-size: .8rem; color: var(--muted); display: flex; align-items: center; gap: 5px; }
.s-dl dd { margin: 2px 0 0; font-weight: 600; }
.s-acts { display: flex; flex-direction: column; gap: 8px; }
.s-dots { display: grid; grid-template-columns: repeat(25, 1fr); gap: 2px; }
.s-dots span { aspect-ratio: 1; background: var(--accent); }
.s-dotcap { font-size: .85rem; color: var(--muted); margin-top: 8px !important; }
.s-dotcap b { color: var(--ink); }
.s-rank { display: flex; align-items: center; gap: 6px; font-size: .92rem; font-weight: 600; margin-top: 10px !important; }
.s-rank .ic { color: var(--accent-text); }
.s-track { display: flex; align-items: center; margin: 4px 0 14px; flex-wrap: wrap; row-gap: 8px; }
.s-step { display: flex; align-items: center; gap: 6px; font-size: .84rem; color: var(--muted); white-space: nowrap; }
.s-dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); }
.s-step.done { color: var(--ink); }
.s-step.done .s-dot { background: var(--accent); border-color: var(--accent); }
.s-tbar { flex: 1; height: 2px; min-width: 14px; margin: 0 8px; background: var(--line); }
.s-tbar.done { background: var(--accent); }
.s-help { font-size: .86rem; color: var(--muted); margin-top: 10px !important; }
.sh-link { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.sh-in { flex: 1 1 200px; min-width: 0; padding: 9px 12px; border: 1px solid var(--line); background: var(--bg); }
.sh-quick { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
.sh-img { aspect-ratio: 4 / 5; max-width: 300px; margin: 0 auto 14px; background: var(--surface); border: 1px solid var(--line); border-top: 5px solid var(--accent); display: flex; flex-direction: column; justify-content: space-between; padding: 22px 20px; }
.sh-img-title { font-size: 1.55rem; line-height: 1.15; font-weight: 700; letter-spacing: -0.01em; }
.sh-img-foot { display: flex; flex-direction: column; gap: 4px; font-size: .82rem; color: var(--muted); }
.sh-img-count b { font-size: 2.2rem; color: var(--ink); line-height: 1; margin-right: 6px; }
.sh-flyer { aspect-ratio: 8.5 / 11; max-width: 300px; margin: 0 auto 14px; background: #fff; color: #111; border: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; text-align: center; padding: 0 20px 18px; gap: 8px; }
.sh-flyer .band { align-self: stretch; margin: 0 -20px; background: var(--accent); color: var(--on-accent); padding: 10px; font-weight: 700; }
.sh-flyer h4 { margin: 8px 0 0; font-size: 1.25rem; line-height: 1.15; }
.sh-flyer p { margin: 0; font-size: .8rem; color: #444; }
.sh-flyer small { color: #555; }
.qr { width: 120px; height: 120px; border: 1px solid #ddd; }
.sh-actions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
@media (max-width: 860px) {
  .s-pg { grid-template-columns: 1fr; }
  .s-side { order: -1; position: static; }
  .s-filters { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 560px) { .s-filters { grid-template-columns: 1fr; } }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; font-size: .9rem; z-index: 80; max-width: 92vw; text-align: center; }
.foot { margin-top: 28px; color: var(--muted); font-size: .85rem; }

@media (max-width: 860px) {
  .cols { grid-template-columns: 1fr; }
  .rowh { display: none; }
  .rows .row { grid-template-columns: 36px 1fr; row-gap: 6px; }
  .row .nm, .row .age, .row .stc { grid-column: 2; }
  .row .nm b { display: inline; margin-right: 6px; }
  .prow { grid-template-columns: 26px 36px 1fr; row-gap: 6px; }
  .prow .pw, .prow .pd, .prow .ps, .prow .pa { grid-column: 3; justify-content: flex-start; }
}
@media (max-width: 560px) { .fields { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><div class="mark" aria-hidden="true">SGA</div><div><b>Husky Proposals</b><small>Concept 2</small></div></div>
    <div class="who">
      <div class="seg" role="group" aria-label="View as">
        <button type="button" data-m="student" aria-pressed="true">Student view</button>
        <button type="button" data-m="sga" aria-pressed="false">SGA view</button>
      </div>
      <span class="userchip" id="whoUser">Signed in with SSO</span>
      <span class="who" id="sgaTools" hidden>
        <div class="seg" role="group" aria-label="Role">
          <button type="button" data-role="vp" aria-pressed="true">VP of Campus Affairs</button>
          <button type="button" data-role="chair" aria-pressed="false">Board chair or director</button>
        </div>
        <select class="sel" id="boardSel" aria-label="Your board" hidden></select>
        <button type="button" class="btn" data-act="opts">Options</button>
      </span>
    </div>
  </header>
  <p class="modenote" id="modenote"></p>
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <main id="view"></main>
  <p class="foot">Concept mockup. Every idea, name, and number is sample content. Dates assume today is Oct 7.</p>
</div>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-label="Idea details"></aside>
<dialog id="msgdlg" aria-labelledby="msg-t"></dialog>
<dialog id="optdlg" aria-labelledby="opt-t"></dialog>
<dialog id="editdlg" aria-labelledby="edit-t"></dialog>
<dialog id="sharedlg" aria-labelledby="share-t"></dialog>
<dialog id="spropdlg" aria-labelledby="sp-t"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const TODAY = new Date(2026, 9, 7);
const dstr = n => { const d = new Date(TODAY); d.setDate(d.getDate() + n); return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }); };
const NEXT_REVIEW = 'Nov 3';

const PATHS = {
  plus: '<path d="M12 5v14M5 12h14"/>', mail: '<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M4 7l8 6 8-6"/>',
  users: '<circle cx="9" cy="8" r="3.5"/><path d="M3 20c0-3.5 2.7-6 6-6s6 2.5 6 6M16 4.5a3.5 3.5 0 010 7M18 14.5c1.8.7 3 2.4 3 5.5"/>',
  tag: '<path d="M3 12V4h8l10 10-8 8L3 12z"/><circle cx="7.5" cy="8.5" r="1.3"/>', x: '<path d="M6 6l12 12M18 6L6 18"/>',
  check: '<path d="M5 12.5l4.5 4.5L19 7"/>', bell: '<path d="M6 16v-5a6 6 0 0112 0v5l1.5 2h-15L6 16z"/><path d="M10 21h4"/>'
};
const ic = n => `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${PATHS[n]}</svg>`;

const BOARDS = [
  { id: 'DAB', name: 'Dining Advisory Board', tag: 'Dining' },
  { id: 'CPAB', name: 'Campus Planning Advisory Board', tag: 'Campus Planning' },
  { id: 'CSC', name: 'Campus Services Committee', tag: 'Campus Services' },
  { id: 'GIB', name: 'Green Initiatives Board', tag: 'Green Initiatives' },
  { id: 'SC', name: 'Sustainability Committee', tag: 'Sustainability' }
];
const LAB = { collecting: 'Collecting support', review: 'Under review', active: 'In progress', delivered: 'Delivered', waiting: 'Waiting' };
const REASONS = ['The board is busy with other ideas right now', 'It needs more information first', 'It needs administration approval first', 'It overlaps with another idea', 'It is outside what SGA can do'];

let I = [
  { id: 103, title: 'A student-hosted food pantry', board: 'DAB', scale: 'Large', cost: '$5k+', sup: 412, wk: 38, age: 62, status: 'active', fol: 56, flag: false, desc: 'A free, stigma-free place to pick up groceries and essentials, hosted by an existing campus office.', upd: [{ d: 2, t: 'Began drafting legislation for the pilot program' }, { d: 9, t: 'Committee formed' }] },
  { id: 131, title: 'A late-night dining option on weeknights', board: 'DAB', scale: 'Medium', cost: '$5k+', sup: 233, wk: 21, age: 40, status: 'collecting', fol: 18, flag: false, desc: 'Keep one dining location open later for students coming out of labs and libraries.', upd: [] },
  { id: 132, title: 'Label halal and kosher options at every station', board: 'DAB', scale: 'Small', cost: 'Under $1k', sup: 98, wk: 9, age: 25, status: 'collecting', fol: 7, flag: false, desc: 'Clear labels at each dining station so students do not have to ask staff every time.', upd: [] },
  { id: 133, title: 'Make Swipe2Care donations automatic', board: 'DAB', scale: 'Medium', cost: '$1k to $5k', sup: 187, wk: 15, age: 30, status: 'review', fol: 22, flag: false, desc: 'Let students opt in to donate unused swipes automatically instead of one at a time.', upd: [] },
  { id: 112, title: 'Ease peak-hour crowding at Marino', board: 'CPAB', scale: 'Medium', cost: '$1k to $5k', sup: 287, wk: 21, age: 45, status: 'active', fol: 31, flag: false, desc: 'Show live capacity and nudge people toward quieter hours so the afternoon rush spreads out.', upd: [{ d: 34, t: 'Committee formed' }] },
  { id: 118, title: 'Covered bike parking near Ruggles', board: 'CPAB', scale: 'Medium', cost: '$1k to $5k', sup: 176, wk: 12, age: 33, status: 'collecting', fol: 14, flag: false, desc: 'Protect bikes from snow and rain at the busiest entrance to campus.', upd: [] },
  { id: 121, title: 'Extend study room reservations to 24 hours during finals week', board: 'CPAB', scale: 'Small', cost: 'Under $1k', sup: 41, wk: 6, age: 20, status: 'collecting', fol: 5, flag: false, desc: 'Let students book library study rooms overnight during finals.', upd: [] },
  { id: 141, title: 'A safety resource guide for international students', board: 'CSC', scale: 'Small', cost: 'Under $1k', sup: 63, wk: 7, age: 28, status: 'collecting', fol: 12, flag: true, desc: 'One page of safety and emergency resources, shared through trusted peer channels.', upd: [] },
  { id: 142, title: 'Shuttle schedule alerts on phones', board: 'CSC', scale: 'Medium', cost: '$1k to $5k', sup: 120, wk: 10, age: 18, status: 'collecting', fol: 9, flag: false, desc: 'Push alerts when the shuttle is delayed or the schedule changes.', upd: [] },
  { id: 87, title: 'Compost bins in every residence hall', board: 'GIB', scale: 'Medium', cost: '$1k to $5k', sup: 365, wk: 17, age: 120, status: 'delivered', fol: 40, flag: false, desc: 'A labeled compost bin on each floor with a simple pickup schedule.', upd: [{ d: 14, t: 'Bins installed in the first three residence halls' }, { d: 30, t: 'Signage and staff guide approved' }] },
  { id: 151, title: 'More refill stations in academic buildings', board: 'GIB', scale: 'Small', cost: 'Under $1k', sup: 142, wk: 11, age: 22, status: 'collecting', fol: 11, flag: false, desc: 'Bottle refill stations on every floor of the busiest classroom buildings.', upd: [] },
  { id: 161, title: 'A reusable container program for dining', board: 'SC', scale: 'Large', cost: '$5k+', sup: 205, wk: 14, age: 36, status: 'collecting', fol: 16, flag: false, desc: 'Reusable takeout containers with a simple return system.', upd: [] }
];
let P = [
  { id: 1, name: 'Maya T.', init: 103, ago: 2, status: 'new' }, { id: 2, name: 'Priya N.', init: 103, ago: 9, status: 'contacted', cago: 5 },
  { id: 3, name: 'Chris L.', init: 103, ago: 9, status: 'new' }, { id: 4, name: 'Riley S.', init: 103, ago: 20, status: 'joined' },
  { id: 5, name: 'Avery D.', init: 103, ago: 1, status: 'new' }, { id: 6, name: 'Alex R.', init: 112, ago: 3, status: 'new' },
  { id: 7, name: 'Jordan P.', init: 112, ago: 6, status: 'contacted', cago: 1 }, { id: 8, name: 'Taylor M.', init: 112, ago: 8, status: 'new' },
  { id: 9, name: 'Sam K.', init: 87, ago: 90, status: 'joined' }, { id: 10, name: 'Devon B.', init: 87, ago: 60, status: 'later' },
  { id: 11, name: 'Morgan C.', init: 141, ago: 4, status: 'new' }, { id: 12, name: 'Jamie F.', init: 141, ago: 0, status: 'new' },
  { id: 13, name: 'Casey W.', init: 118, ago: 5, status: 'new' }, { id: 14, name: 'Quinn H.', init: 151, ago: 20, status: 'contacted', cago: 12 },
  { id: 15, name: 'Skyler J.', init: 132, ago: 6, status: 'new' }
];
P.forEach(p => { p.email = p.name.toLowerCase().replace(/[^a-z ]/g, '').replace(' ', '.') + '@husky.example'; });

const DEF = { cap: 2, thr: 150, contact: 7, follow: 14, stale: 30, leader: 'queue' };
const st = {
  role: 'vp', board: 'DAB', tab: 'queue', hl: null, sel: null,
  f: { board: 'all', status: 'all', sort: 'sup', q: '' },
  pf: { as: 'self', board: 'DAB', title: '', scale: 'Medium', cost: 'Under $1k', time: 'This semester', desc: '', claim: false, reason: '' },
  up: { id: null, tpl: 'formed', text: '', status: 'keep', aud: 'followers' },
  pp: { status: 'new', init: 'all', picked: new Set() },
  opts: { ...DEF }, nextId: 170
};

st.uf = { board: 'all', show: 'all' };

/* derived data */
const byId = id => I.find(i => i.id === id);
const board = id => BOARDS.find(b => b.id === id);
const inScope = i => st.role === 'vp' || i.board === st.board;
const scoped = () => I.filter(inScope);
const pts = i => i.scale === 'Large' ? 2 : 1;
const used = b => I.filter(i => i.board === b && i.status === 'active').reduce((n, i) => n + pts(i), 0);
const capLeft = b => st.opts.cap - used(b);
const people = id => P.filter(p => p.init === id);
const isElig = i => i.status === 'collecting' && i.sup >= st.opts.thr * (i.scale === 'Small' ? 0.5 : 1);
const rankOf = i => 1 + I.filter(o => o.board === i.board && o.status !== 'delivered' && o.sup > i.sup).length;
const lastUpd = i => i.upd.length ? Math.min(...i.upd.map(u => u.d)) : null;
const staleList = () => scoped().filter(i => i.status === 'active' && (lastUpd(i) === null || lastUpd(i) > st.opts.stale));
const dueIn = p => p.status === 'new' ? st.opts.contact - p.ago : p.status === 'contacted' ? st.opts.follow - p.cago : null;
const dueList = () => P.filter(p => inScope(byId(p.init)) && dueIn(p) !== null && dueIn(p) < 0);
const toContact = () => P.filter(p => inScope(byId(p.init)) && p.status === 'new');

let tt;
function toast(m) { const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => { t.hidden = true; }, 3000); }
const chipFor = i => `<span class="st st-${i.status}">${LAB[i.status]}</span>`;

/* chrome */
function renderChrome() {
  const stu = st.mode === 'student';
  $('#sgaTools').hidden = stu; $('#whoUser').hidden = !stu;
  $$('[data-m]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.m === st.mode)));
  $('#modenote').textContent = stu ? 'You are seeing what a student sees. Votes, offers to help, and new ideas show up in the SGA view.' : 'You are seeing what SGA leaders see. Updates you post and ideas you start show up in the student view.';
  if (stu) {
    $('#tabs').innerHTML = [['ideas', 'Ideas'], ['progress', 'In progress']].map(t => `<button type="button" class="tab" role="tab" data-stab="${t[0]}" aria-selected="${st.stab === t[0]}">${t[1]}</button>`).join('') + `<button type="button" class="s-compose" data-snew>${ic('plus')}Submit yours!</button>`;
    return;
  }
  $$('[data-role]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.role === st.role)));
  const sel = $('#boardSel');
  sel.hidden = st.role === 'vp';
  sel.innerHTML = BOARDS.map(b => `<option value="${b.id}"${b.id === st.board ? ' selected' : ''}>${b.id}: ${b.name}</option>`).join('');
  const elig = scoped().filter(isElig).length, stale = staleList().length, due = dueList().length;
  const pl = (n, one, many) => n === 1 ? one : many;
  const bd = (n, label) => `<span class="badge${n ? '' : ' zero'}" title="${n} ${label}">${n}<span class="vh"> ${label}</span></span>`;
  $('#tabs').innerHTML = [
    ['queue', 'Queue', bd(elig, `${pl(elig, 'idea is', 'ideas are')} ready for review`)],
    ['propose', 'Propose', ''],
    ['updates', 'Updates', bd(stale, `in-progress ${pl(stale, 'idea is', 'ideas are')} due for an update`)],
    ['people', 'People', bd(due, `${pl(due, 'person is', 'people are')} past their contact date`)]
  ].map(t => `<button type="button" class="tab" role="tab" data-tab="${t[0]}" aria-selected="${st.tab === t[0]}">${t[1]}${t[2]}</button>`).join('');
}

/* QUEUE */
function boardCard(b) {
  const act = I.filter(i => i.board === b.id && i.status === 'active');
  const elig = I.filter(i => i.board === b.id && isElig(i)).length;
  const over = used(b.id) > st.opts.cap;
  return `<button type="button" class="bcard" data-board="${b.id}" aria-pressed="${st.f.board === b.id}">
    <b>${b.id}</b><small>${b.name}</small>
    <p class="bsum"><b>${act.length} in progress</b>${over ? ' <span class="mini warn">More than usual</span>' : ''}</p>
    <p class="bact">${act.length ? act.map(i => esc(i.title)).join(', ') : 'Nothing in progress'}</p>
    <small>${elig} ready for review. Boards usually take on 1 to ${st.opts.cap}.</small></button>`;
}
function sortFn(a, b) {
  const k = st.f.sort;
  if (k === 'will') return people(b.id).length - people(a.id).length;
  if (k === 'wk') return b.wk - a.wk;
  if (k === 'old') return b.age - a.age;
  if (k === 'new') return a.age - b.age;
  return b.sup - a.sup;
}
function filtered() {
  const f = st.f;
  return scoped().filter(i =>
    (st.role !== 'vp' || f.board === 'all' || i.board === f.board) &&
    (f.status === 'all' || (f.status === 'elig' ? isElig(i) : i.status === f.status)) &&
    (!f.q || (i.title + ' ' + i.desc).toLowerCase().includes(f.q.toLowerCase()))).sort(sortFn);
}
function viewQueue() {
  const vp = st.role === 'vp', elig = scoped().filter(isElig).length;
  const stat = [['all', 'All ideas'], ['elig', `Ready for review (${elig})`], ['collecting', 'Collecting support'], ['review', 'Under review'], ['active', 'In progress'], ['waiting', 'Waiting'], ['delivered', 'Delivered']];
  const sorts = [['sup', 'Most supporters'], ['will', 'Most willing to help'], ['wk', 'Rising this week'], ['old', 'Oldest'], ['new', 'Newest']];
  const opt = (arr, cur) => arr.map(o => `<option value="${o[0]}"${cur === o[0] ? ' selected' : ''}>${o[1]}</option>`).join('');
  const boardSel = vp
    ? `<select id="boardFilter"><option value="all">All boards</option>${BOARDS.map(b => `<option value="${b.id}"${st.f.board === b.id ? ' selected' : ''}>${b.id}: ${b.name}</option>`).join('')}</select>`
    : `<select id="boardFilter" disabled><option>${board(st.board).id}: ${board(st.board).name}</option></select>`;
  const list = filtered();
  const rows = list.length ? list.map(i => {
    const w = people(i.id).length;
    const tags = `<span class="tg">${ic('tag')}${board(i.board).tag}</span><span class="mini">${i.scale}</span>${i.by ? `<span class="mini">Proposed by ${esc(i.by)}</span>` : ''}`;
    return `<button type="button" class="row${st.hl === i.id ? ' hl' : ''}" data-open="${i.id}">
      <span class="rk">${i.status === 'delivered' ? '' : '#' + rankOf(i)}</span>
      <span class="ti"><b>${esc(i.title)}</b><span class="tags">${tags}</span></span>
      <span class="nm"><b>${i.sup}</b><small>+${i.wk} this week</small></span>
      <span class="nm"><b>${w}</b></span>
      <span class="age">${i.age} days</span>
      <span class="stc">${chipFor(i)}</span></button>`;
  }).join('') : '<div class="empty">No ideas match these filters.</div>';
  return `<div class="listbox">
    <div class="fbar">
      <input class="search" type="search" id="q" placeholder="Search ideas" aria-label="Search ideas" value="${esc(st.f.q)}">
      <div class="fgrid">
        <label class="fld"><span>Board</span>${boardSel}<small>${vp ? 'Whose ideas to show' : 'Your board'}</small></label>
        <label class="fld"><span>Status</span><select id="statSel">${opt(stat, st.f.status)}</select><small>Where an idea is in the process</small></label>
        <label class="fld"><span>Sort by</span><select id="sortSel">${opt(sorts, st.f.sort)}</select><small>The order of the list</small></label>
        <p class="count" aria-live="polite"><b>${list.length}</b> ${list.length === 1 ? 'idea' : 'ideas'}</p>
      </div>
    </div>
    <div class="rows"><div class="rowh"><span>Rank</span><span>Idea</span><span>Supporters</span><span>Willing to help</span><span>Age</span><span>Status</span></div>${rows}</div>
  </div>
  <p class="note">Rank is within each board. Delivered ideas are kept for the record.</p>`;
}

/* DRAWER */
function openDrawer(id) { st.sel = id; renderDrawer(); $('#drawer').hidden = false; $('#scrim').hidden = false; $('#drawer').scrollTop = 0; }
function closeDrawer() { st.sel = null; st.confirm = null; $('#drawer').hidden = true; $('#scrim').hidden = true; }
function renderDrawer() {
  const i = byId(st.sel); if (!i) return closeDrawer();
  const b = board(i.board), w = people(i.id).length, open = ['collecting', 'review', 'waiting'].includes(i.status);
  const n = I.filter(o => o.board === i.board && o.status === 'active').length;
  let act = '';
  if (st.confirm === i.id) {
    act = `<div class="hint"><b>${b.id} is already working on ${n} ${n === 1 ? 'idea' : 'ideas'}.</b> Boards usually take on 1 to ${st.opts.cap} at a time, and a large idea counts as 2. Start this one anyway?</div>
      <div class="inline"><button type="button" class="btn primary" data-act="startanyway">Start anyway</button><button type="button" class="btn" data-act="startcancel">Not now</button></div>`;
  } else if (open) {
    act = `<button type="button" class="btn primary" data-act="start">Start working on this</button>
      <div class="inline">${i.status !== 'review' ? '<button type="button" class="btn" data-act="review">Mark under review</button>' : ''}${i.status === 'waiting' ? '<button type="button" class="btn" data-act="collect">Back to collecting support</button>' : ''}</div>
      ${i.status !== 'waiting' ? `<div class="inline"><select class="sel" id="reasonSel" aria-label="Reason students will see">${REASONS.map(r => `<option>${r}</option>`).join('')}</select><button type="button" class="btn" data-act="wait">Put on hold</button></div>` : ''}`;
  } else if (i.status === 'active') act = '<div class="inline"><button type="button" class="btn primary" data-act="post">Post an update</button><button type="button" class="btn" data-act="deliver">Mark delivered</button></div>';
  else act = '<p class="note" style="margin:0">Delivered. It stays on record.</p>';
  const reason = i.status === 'waiting' && i.reason ? `<p class="hint" style="margin:0 0 12px">Students see: "${esc(i.reason)}."</p>` : '';
  const last = i.upd.slice(0, 2);
  return $('#drawer').innerHTML = `<div class="dhead"><span class="mini">Proposal ${i.id}</span><span class="inline"><button type="button" class="btn sm" data-act="edit">Edit</button><button type="button" class="btn sm" data-act="close" aria-label="Close">${ic('x')}Close</button></span></div>
    <h3>${esc(i.title)}</h3>
    <div class="tags"><span class="tg">${ic('tag')}${b.tag}</span>${chipFor(i)}</div>
    <p class="facts"><b>${i.sup}</b> supporters, <b>${i.status === 'delivered' ? '-' : '#' + rankOf(i)}</b> in ${b.id}, <b>${i.fol}</b> followers</p>
    <p class="dd">${esc(i.desc)}</p>${reason}

  const bar = `<div class="pseg seg" role="group" aria-label="Share format" style="margin-bottom:14px">${tabs.map(t => `<button type="button" data-ssharetab="${t[0]}" aria-pressed="${st.shareTab === t[0]}">${t[1]}</button>`).join('')}</div>`;
  let body = '';
  if (st.shareTab === 'link') body = `<div class="sh-link"><input class="sh-in" readonly value="${SHARE_URL(i)}" aria-label="Link to this proposal"><button type="button" class="btn primary" data-scopy>${ic('share')}Copy link</button></div>
    <div class="sh-quick"><button type="button" class="btn" data-sshareact="Opening a text message">Text</button><button type="button" class="btn" data-sshareact="Opening an email">Email</button><button type="button" class="btn" data-sshareact="Copying a group chat message">Group chat</button></div>
    <p class="note">Anyone with the link lands on this proposal and signs in with SSO to support it.</p>`;
  if (st.shareTab === 'image') body = `<div class="sh-img"><div class="s-tags"><span class="s-num">Proposal ${i.id}</span><span class="tg">${board(i.board).tag}</span></div><div class="sh-img-title">${esc(i.title)}</div><div class="sh-img-foot"><div class="sh-img-count"><b>${i.sup}</b>students support this</div><span>Support it at ${SHARE_URL(i)}</span></div></div>
    <div class="sh-actions"><button type="button" class="btn primary" data-sshareact="Downloading the image">Download image</button></div><p class="note">A picture for stories and group chats. It shows today's count, so it goes out of date as support grows.</p>`;
  if (st.shareTab === 'flyer') body = `<div class="sh-flyer"><div class="band">Support proposal ${i.id}</div><h4>${esc(i.title)}</h4><p>${i.desc.length > 110 ? esc(i.desc.slice(0, 108).replace(/\s+\S*$/, '')) + '...' : esc(i.desc)}</p>${qrSVG(i.id)}<small>Scan to support this idea.</small></div>
    <div class="sh-actions"><button type="button" class="btn primary" data-sshareact="Printing the flyer">Print flyer</button><button type="button" class="btn" data-sshareact="Downloading a PDF">Download PDF</button></div><p class="note">For tabling and bulletin boards. The QR code here is a sample and will not scan.</p>`;
  return bar + body;
}
function renderShare() { $('#sharedlg').innerHTML = `<div class="dlg"><div class="inline" style="justify-content:space-between;margin-bottom:12px"><h3 id="share-t" style="margin:0">Share this proposal</h3><button type="button" class="btn sm" data-sclose>Close</button></div>${shareHTML(byId(st.sp))}</div>`; }

/* submit an idea (student) */
function openSNew() {
  const sel = (id, arr, cur) => `<select id="${id}">${arr.map(v => `<option${v === cur ? ' selected' : ''}>${v}</option>`).join('')}</select>`;
  $('#spropdlg').innerHTML = `<div class="dlg"><h3 id="sp-t">Submit yours</h3><p class="sub">Tell SGA what you want to see change. Keep it short. People can support it as soon as it is posted.</p>
    <div class="fields"><div class="field full"><label for="sd-title">Name</label><input id="sd-title" placeholder="What would you call it?" autocomplete="off"></div>
    <div class="field full" id="sd-hint-wrap" hidden><p class="hint" id="sd-hint" style="margin:0"></p></div>
    <div class="field"><label for="sd-loc">Where</label><input id="sd-loc" placeholder="Building or area"></div>
    <div class="field"><label for="sd-cat">Category</label>${sel('sd-cat', BOARDS.map(b => b.tag), 'Dining')}</div>
    <div class="field"><label for="sd-scale">Scale</label>${sel('sd-scale', ['Small', 'Medium', 'Large'], 'Medium')}</div>
    <div class="field"><label for="sd-cost">Rough cost</label>${sel('sd-cost', ['Under $1k', '$1k to $5k', '$5k+'], 'Under $1k')}</div>
    <div class="field full"><label for="sd-time">Time</label>${sel('sd-time', ['This semester', 'Next semester', 'Within a year'], 'This semester')}</div>
    <div class="field full"><label for="sd-desc">Description</label><textarea id="sd-desc" placeholder="What is the problem, and what would you change?"></textarea></div></div>
    <div class="dlg-actions"><button type="button" class="btn" data-scancel>Cancel</button><button type="button" class="btn primary" data-ssubmit>Post idea</button></div></div>`;
  $('#spropdlg').showModal(); $('#sd-title').focus();
}
const STOPW = new Set(['the', 'and', 'for', 'more', 'with', 'that', 'every', 'near', 'campus']);
function similarIdea(text) {
  const w = text.toLowerCase().split(/\W+/).filter(x => x.length > 3 && !STOPW.has(x));
  return w.length ? I.find(i => sOpen(i) && w.some(x => (i.title + ' ' + i.desc).toLowerCase().includes(x))) : null;
}
function submitSNew() {
  const title = $('#sd-title').value.trim(), desc = $('#sd-desc').value.trim();
  if (!title || !desc) return toast('Add a name and a description first.');
  const tag = $('#sd-cat').value, b = BOARDS.find(x => x.tag === tag);
  const i = { id: st.nextId++, title, board: b.id, scale: $('#sd-scale').value, cost: $('#sd-cost').value, sup: 1, wk: 1, age: 0, status: 'collecting', fol: 1, flag: false, desc, loc: $('#sd-loc').value.trim() || 'Anywhere on campus', time: $('#sd-time').value, full: [desc], author: 'You', upd: [] };
  I.push(i); me.voted.add(i.id); me.follow.add(i.id); st.hl = i.id;
  $('#spropdlg').close(); st.stab = 'ideas'; st.sp = null; st.sf = { q: '', cat: 'all', status: 'all', sort: 'new' };
  render(); window.scrollTo(0, 0); toast('Posted. It is on the list and collecting support.');
}

/* student events */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-m],[data-stab],[data-svote],[data-spart],[data-sopen],[data-sback],[data-sfollow],[data-scontact],[data-sshare],[data-ssharetab],[data-scopy],[data-sshareact],[data-sclose],[data-snew],[data-sapply],[data-ssubmit],[data-scancel]');
  if (!t) return;
  const d = t.dataset, i = d.svote ? byId(Number(d.svote)) : d.spart ? byId(Number(d.spart)) : d.sfollow ? byId(Number(d.sfollow)) : null;
  if (d.m) { st.mode = d.m; closeDrawer(); st.sp = null; render(); return window.scrollTo(0, 0); }
  if (d.stab) { st.stab = d.stab; st.sp = null; st.sf = { q: '', cat: 'all', status: 'all', sort: 'sup' }; return render(); }
  if (d.svote) { if (me.voted.has(i.id)) { me.voted.delete(i.id); i.sup--; i.wk = Math.max(0, i.wk - 1); } else { me.voted.add(i.id); i.sup++; i.wk++; } return render(); }
  if (d.spart) {
    if (me.part.has(i.id)) { const pid = me.part.get(i.id); P = P.filter(p => p.id !== pid); me.part.delete(i.id); }
    else { const pid = nextPid++; P.push({ id: pid, name: 'You', email: 'you@husky.example', init: i.id, ago: 0, status: 'new' }); me.part.set(i.id, pid); toast('Thanks. SGA will reach out about how to help.'); }
    return render();
  }
  if (d.sopen) { st.sp = Number(d.sopen); render(); return window.scrollTo(0, 0); }
  if (t.hasAttribute('data-sback')) { st.sp = null; render(); return window.scrollTo(0, 0); }
  if (d.sfollow) { if (me.follow.has(i.id)) { me.follow.delete(i.id); i.fol--; } else { me.follow.add(i.id); i.fol++; toast(`You will get updates on proposal ${i.id}.`); } return render(); }
  if (t.hasAttribute('data-scontact')) return toast('Concept only: this opens a message to the committee.');
  if (t.hasAttribute('data-sapply')) return toast('Concept only: this opens the board application.');
  if (t.hasAttribute('data-sshare')) { renderShare(); return $('#sharedlg').showModal(); }
  if (d.ssharetab) { st.shareTab = d.ssharetab; return renderShare(); }
  if (t.hasAttribute('data-sclose')) return $('#sharedlg').close();
  if (d.sshareact) return toast(`Concept only: ${d.sshareact} would happen here.`);
  if (t.hasAttribute('data-scopy')) { const url = SHARE_URL(byId(st.sp)); return void navigator.clipboard.writeText(url).then(() => toast('Link copied.')).catch(() => toast('Copy is blocked here. Select the link instead.')); }
  if (t.hasAttribute('data-snew')) return openSNew();
  if (t.hasAttribute('data-scancel')) return $('#spropdlg').close();
  if (t.hasAttribute('data-ssubmit')) return submitSNew();
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'sCat') { st.sf.cat = t.value; return render(); }
  if (t.id === 'sStatus') { st.sf.status = t.value; return render(); }
  if (t.id === 'sSort') { st.sf.sort = t.value; return render(); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'sq') { st.sf.q = t.value; const pos = t.selectionStart; render(); const q = $('#sq'); q.focus(); q.setSelectionRange(pos, pos); return; }
  if (t.id === 'sd-title') { const m = similarIdea(t.value); $('#sd-hint-wrap').hidden = !m; if (m) $('#sd-hint').textContent = `A similar idea already exists: "${m.title}". You can still post yours, and SGA can see both.`; }
});

render();
</script>
</body>
</html>
