<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Husky Proposals: UI playground</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:wght@600;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600&display=swap">
<style>
:root {
  color-scheme: light;
  --bg: #F1F2F5;
  --surface: #FFFFFF;
  --ink: #1A1D26;
  --muted: #596070;
  --line: #DADDE4;
  --sky: #E3EBF7; --sky-ink: #26456F;
  --amber: #FFF0CF; --amber-ink: #74480A;
  --green: #DCF0E5; --green-ink: #17603B;
  --focus: #1F5FBF;

  /* set by the controls */
  --accent: #C8102E;
  --accent-text: #C8102E;
  --on-accent: #FFFFFF;
  --r: 14px;
  --display: 'Bricolage Grotesque', 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
  --body: 'Instrument Sans', 'Segoe UI', system-ui, sans-serif;

  --r-sm: calc(var(--r) * 0.6);
  --r-lg: calc(var(--r) * 1.3);
  --r-btn: var(--r-sm);
  --accent-soft: color-mix(in srgb, var(--accent) 14%, var(--surface));
  --ui: 'Instrument Sans', 'Segoe UI', system-ui, sans-serif;

  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
:root[data-btn="pill"] { --r-btn: 999px; }
:root[data-tone="warm"] { --bg: #F5F1EA; --surface: #FFFEFB; --line: #E0D9CC; }
:root[data-tone="white"] { --bg: #FFFFFF; --surface: #FFFFFF; --line: #E1E4EA; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #13151A; --surface: #1C1F27; --ink: #ECEEF3; --muted: #A0A7B5; --line: #2D313C;
    --sky: #1F2E47; --sky-ink: #A9C6F2;
    --amber: #3A2D12; --amber-ink: #F0CB7D;
    --green: #153325; --green-ink: #92D7B2;
    --focus: #7AA7F0;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #13151A; --surface: #1C1F27; --ink: #ECEEF3; --muted: #A0A7B5; --line: #2D313C;
  --sky: #1F2E47; --sky-ink: #A9C6F2;
  --amber: #3A2D12; --amber-ink: #F0CB7D;
  --green: #153325; --green-ink: #92D7B2;
  --focus: #7AA7F0;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
button, input, select, textarea { font: inherit; color: inherit; }
.ic { width: 1.1em; height: 1.1em; flex: none; }

.page { max-width: 1240px; margin: 0 auto; padding: 20px 20px 48px; }
.layout { display: grid; grid-template-columns: 320px 1fr; gap: 28px; align-items: start; }

/* control panel: fixed look so it never changes with the previewed style */
.panel {
  position: sticky; top: calc(12px + env(safe-area-inset-top, 0px));
  max-height: calc(100dvh - 24px); overflow: auto;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  font-family: var(--ui); font-size: 15px; z-index: 30;
}
.handle { display: none; }
.pbody { padding: 18px; }
.panel h1 { font-family: var(--ui); font-size: 1.15rem; margin: 0 0 2px; font-weight: 600; }
.panel .sub { margin: 0 0 14px; color: var(--muted); font-size: .88rem; }
.ctl { padding: 14px 0; border-top: 1px solid var(--line); }
.ctl h2 { font-family: var(--ui); font-size: .95rem; font-weight: 600; margin: 0 0 10px; }
.ctl label, .ctl .lab { display: flex; justify-content: space-between; align-items: center; font-size: .88rem; color: var(--muted); margin-bottom: 6px; }
.ctl output { color: var(--ink); font-weight: 600; }
.ctl input[type="range"] { width: 100%; accent-color: var(--ink); margin: 0 0 12px; }
.pseg { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin-bottom: 12px; }
.pseg button { flex: 1; appearance: none; border: 0; background: transparent; padding: 8px 6px; cursor: pointer; font-size: .86rem; }
.pseg button + button { border-left: 1px solid var(--line); }
.pseg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap: 8px; margin-bottom: 12px; }
.sw { appearance: none; cursor: pointer; width: 100%; aspect-ratio: 1; border-radius: 50%; border: 3px solid var(--surface); background: var(--c); box-shadow: 0 0 0 1px var(--line); }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--ink); }
.custom { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: .88rem; color: var(--muted); }
.custom input { width: 44px; height: 30px; padding: 0; border: 1px solid var(--line); border-radius: 8px; background: transparent; cursor: pointer; }
.fonts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.fnt { appearance: none; cursor: pointer; text-align: left; border: 1px solid var(--line); background: transparent; border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; gap: 0; }
.fnt .aa { font-size: 1.5rem; line-height: 1.1; font-weight: 700; }
.fnt .nm { font-family: var(--ui); font-size: .78rem; color: var(--muted); }
.fnt[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.readout { margin: 0 0 10px; padding: 10px 12px; background: var(--bg); border-radius: 10px; font: 500 .8rem/1.5 var(--ui); white-space: pre-wrap; user-select: text; }
.prow { display: flex; gap: 8px; }
.pbtn { flex: 1; appearance: none; cursor: pointer; border: 1px solid var(--line); background: transparent; border-radius: 10px; padding: 8px 10px; font-size: .88rem; }

/* previewed board: everything below follows the controls */
.board { min-width: 0; }
.b-label { margin: 26px 0 10px; font: 500 .85rem/1.2 var(--ui); color: var(--muted); }
.b-label:first-of-type { margin-top: 0; }
h2.title { font-family: var(--display); font-weight: 800; font-size: clamp(1.7rem, 4.6vw, 2.5rem); line-height: 1.08; margin: 0 0 6px; letter-spacing: -0.01em; }
.lede { margin: 0; color: var(--muted); max-width: 62ch; }

.rail { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tab { appearance: none; text-align: left; cursor: pointer; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-sm); padding: 12px 14px; }
.tab strong { display: flex; align-items: center; gap: 8px; font-family: var(--display); font-size: 1.05rem; line-height: 1.2; }
.tab span { font-size: .82rem; color: var(--muted); }
.tab[aria-selected="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.tab[aria-selected="true"] strong { color: var(--accent-text); }

.composer { display: flex; align-items: center; justify-content: space-between; gap: 16px; width: 100%; background: var(--accent); color: var(--on-accent); border: 0; border-radius: var(--r-lg); padding: 22px 24px; text-align: left; cursor: pointer; }
.composer h3 { font-family: var(--display); font-weight: 800; font-size: clamp(1.4rem, 3.6vw, 2rem); margin: 0; line-height: 1.1; }
.composer p { margin: 6px 0 0; opacity: .94; }
.composer .plus { flex: none; width: 48px; height: 48px; border-radius: 50%; background: var(--on-accent); color: var(--accent); display: grid; place-items: center; }
.composer .plus .ic { width: 24px; height: 24px; }

.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.search { flex: 1 1 220px; min-width: 0; display: flex; align-items: center; gap: 8px; padding: 10px 14px; border: 1px solid var(--line); border-radius: var(--r-btn); background: var(--surface); color: var(--muted); }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; outline: none; color: var(--ink); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { appearance: none; cursor: pointer; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-btn); padding: 7px 14px; font-size: .9rem; }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 10px; }
.card h3 { font-family: var(--display); font-weight: 700; font-size: 1.18rem; line-height: 1.2; margin: 0; }
.card p { margin: 0; color: var(--muted); font-size: .95rem; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: .8rem; padding: 3px 10px; border-radius: var(--r-btn); background: var(--accent-soft); color: var(--accent-text); }
.pill.plain { background: transparent; border: 1px solid var(--line); color: var(--muted); }
.card-foot { margin-top: auto; padding-top: 6px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }

.btn { appearance: none; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: var(--r-btn); padding: 9px 18px; border: 1px solid var(--line); background: var(--surface); font-weight: 500; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary[aria-pressed="true"] { background: var(--surface); color: var(--accent-text); border-color: var(--accent); }

.token { flex: none; width: 30px; height: 30px; border-radius: 50%; border: 2px dashed var(--line); display: grid; place-items: center; color: transparent; transition: background .15s, border-color .15s; }
.token .ic { width: 16px; height: 16px; }
.token.on { background: var(--accent); border: 2px solid var(--accent); color: var(--on-accent); }
.vote { appearance: none; cursor: pointer; display: inline-flex; align-items: center; gap: 10px; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-btn); padding: 5px 16px 5px 6px; font-weight: 600; }
.vote[aria-pressed="true"] { border-color: var(--accent); color: var(--accent-text); }
.tray { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.tray strong { font-family: var(--display); font-size: 1.05rem; }
.tray .left { color: var(--muted); font-size: .9rem; }

.post { display: grid; grid-template-columns: 84px 1fr; gap: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; }
.num { font-family: var(--display); font-weight: 800; font-size: clamp(2.2rem, 6vw, 3.2rem); line-height: 1; color: var(--accent-text); }
.num small { display: block; font-family: var(--body); font-weight: 500; font-size: .8rem; color: var(--muted); margin-bottom: 4px; }
.post-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.post-head h3 { font-family: var(--display); font-weight: 700; font-size: 1.3rem; line-height: 1.2; margin: 0; }
.status { font-size: .8rem; font-weight: 600; padding: 3px 11px; border-radius: var(--r-btn); background: var(--amber); color: var(--amber-ink); }
.update { margin: 8px 0 0; font-size: 1.02rem; }
.when { margin: 10px 0 0; font-size: .82rem; color: var(--muted); }
.track { display: flex; align-items: center; margin: 14px 0 16px; }
.step { display: flex; align-items: center; gap: 8px; font-size: .82rem; color: var(--muted); white-space: nowrap; }
.dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); }
.step.done { color: var(--ink); }
.step.done .dot { background: var(--accent); border-color: var(--accent); }
.bar { flex: 1; height: 2px; min-width: 14px; margin: 0 8px; background: var(--line); }
.bar.done { background: var(--accent); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }

.formcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; max-width: 560px; }
.formcard h3 { font-family: var(--display); font-weight: 800; font-size: 1.5rem; margin: 0 0 4px; }
.formcard > p { margin: 0 0 14px; color: var(--muted); }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field.full { grid-column: 1 / -1; }
.field label { font-size: .85rem; font-weight: 600; }
.field input, .field select, .field textarea { padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--bg); }
.field textarea { min-height: 76px; resize: vertical; }
.formactions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 11px 18px; border-radius: 999px; font: 500 .92rem var(--ui); z-index: 60; max-width: 92vw; text-align: center; }

@media (max-width: 880px) {
  .layout { grid-template-columns: 1fr; }
  .board { padding-bottom: 96px; }
  .panel {
    position: fixed; left: 0; right: 0; bottom: 0; top: auto; border-radius: 18px 18px 0 0; border-bottom: 0;
    max-height: 64dvh; transform: translateY(calc(100% - 56px - env(safe-area-inset-bottom, 0px)));
    transition: transform .2s; padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .panel.open { transform: none; }
  .handle { display: flex; width: 100%; align-items: center; justify-content: space-between; height: 56px; padding: 0 18px; border: 0; background: transparent; font: 600 1rem var(--ui); cursor: pointer; }
}
@media (max-width: 560px) {
  .post { grid-template-columns: 1fr; gap: 8px; }
  .num small { display: inline; margin: 0 8px 0 0; }
  .fields { grid-template-columns: 1fr; }
  .track { flex-wrap: wrap; row-gap: 8px; }
  .composer { padding: 18px; }
  .rail { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="page">
  <div class="layout">
    <aside class="panel" id="panel" aria-label="Style controls">
      <button type="button" class="handle" id="handle" aria-expanded="false" aria-controls="pbody">
        <span>Style controls</span>
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg>
      </button>
      <div class="pbody" id="pbody">
        <h1>UI playground</h1>
        <p class="sub">Change anything here and the whole board updates.</p>

        <section class="ctl">
          <h2>Corners</h2>
          <label for="r">Roundness <output id="rout">14px</output></label>
          <input type="range" id="r" min="0" max="32" step="2" value="14">
          <div class="lab"><span>Button shape</span></div>
          <div class="pseg" role="group" aria-label="Button shape">
            <button type="button" data-set="btn" data-val="match">Match cards</button>
            <button type="button" data-set="btn" data-val="pill">Pill</button>
          </div>
        </section>

        <section class="ctl">
          <h2>Colors</h2>
          <div class="swatches" id="swatches"></div>
          <div class="custom"><span>Custom accent</span><input type="color" id="custom" value="#C8102E" aria-label="Custom accent color"></div>
          <div class="lab"><span>Background</span></div>
          <div class="pseg" role="group" aria-label="Background tone">
            <button type="button" data-set="tone" data-val="cool">Cool</button>
            <button type="button" data-set="tone" data-val="warm">Warm</button>
            <button type="button" data-set="tone" data-val="white">White</button>
          </div>
          <div class="lab"><span>Mode</span></div>
          <div class="pseg" role="group" aria-label="Light or dark mode">
            <button type="button" data-set="mode" data-val="system">System</button>
            <button type="button" data-set="mode" data-val="light">Light</button>
            <button type="button" data-set="mode" data-val="dark">Dark</button>
          </div>
        </section>

        <section class="ctl">
          <h2>Font</h2>
          <div class="fonts" id="fonts"></div>
        </section>

        <section class="ctl">
          <h2>Icons</h2>
          <div class="pseg" role="group" aria-label="Icons">
            <button type="button" data-set="icons" data-val="on">With icons</button>
            <button type="button" data-set="icons" data-val="off">No icons</button>
          </div>
        </section>

        <section class="ctl">
          <h2>Your settings</h2>
          <pre class="readout" id="readout"></pre>
          <div class="prow">
            <button type="button" class="pbtn" id="copy">Copy settings</button>
            <button type="button" class="pbtn" id="reset">Reset</button>
          </div>
        </section>
      </div>
    </aside>

    <main class="board" id="board" aria-label="Preview"></main>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const root = document.documentElement;

const COLORS = [
  { name: 'Husky red', hex: '#C8102E' },
  { name: 'Harbor blue', hex: '#1F5FBF' },
  { name: 'Pine green', hex: '#1E6B52' },
  { name: 'Teal', hex: '#0E7C86' },
  { name: 'Plum', hex: '#6B2D8C' },
  { name: 'Tangerine', hex: '#D9480F' },
  { name: 'Graphite', hex: '#2B2F3A' }
];
const SANS = "'Segoe UI', system-ui, -apple-system, sans-serif";
const FONTS = [
  { id: 'bricolage', name: 'Bricolage and Instrument', d: "'Bricolage Grotesque'", b: "'Instrument Sans'", fb: SANS },
  { id: 'fraunces', name: 'Fraunces and Figtree', d: "'Fraunces', Georgia", b: "'Figtree'", fb: SANS },
  { id: 'space', name: 'Space Grotesk and DM Sans', d: "'Space Grotesk'", b: "'DM Sans'", fb: SANS },
  { id: 'jakarta', name: 'Plus Jakarta Sans', d: "'Plus Jakarta Sans'", b: "'Plus Jakarta Sans'", fb: SANS },
  { id: 'newsreader', name: 'Newsreader and Public Sans', d: "'Newsreader', Georgia", b: "'Public Sans'", fb: SANS },
  { id: 'system', name: 'System default', d: 'system-ui', b: 'system-ui', fb: "-apple-system, 'Segoe UI', sans-serif" }
];
const DEFAULTS = { r: 14, btn: 'pill', accent: '#C8102E', accentName: 'Husky red', tone: 'cool', mode: 'system', font: 'bricolage', icons: true };
const state = { ...DEFAULTS, tab: 'propose', voted: new Set(['103']), follow: false, div: 'All' };

/* icons */
const PATHS = {
  pencil: '<path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/>',
  vote: '<rect x="3" y="3" width="18" height="18" rx="4"/><path d="M8 12.5l3 3 5-6"/>',
  feed: '<path d="M4 6h16M4 12h16M4 18h10"/>',
  pin: '<path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0113 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/>',
  coins: '<circle cx="12" cy="12" r="9"/><path d="M12 7v10M14.5 9.5c-.4-.9-1.3-1.3-2.5-1.3s-2.3.6-2.3 1.7c0 2.3 4.8 1.2 4.8 3.4 0 1.1-1.1 1.8-2.5 1.8s-2.2-.5-2.6-1.4"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  layers: '<path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/>',
  tag: '<path d="M3 12V4h8l10 10-8 8L3 12z"/><circle cx="7.5" cy="8.5" r="1.3"/>',
  bell: '<path d="M6 16v-5a6 6 0 0112 0v5l1.5 2h-15L6 16z"/><path d="M10 21h4"/>',
  mail: '<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M4 7l8 6 8-6"/>',
  search: '<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  check: '<path d="M5 12.5l4.5 4.5L19 7"/>'
};
const ic = name => state.icons
  ? `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${PATHS[name]}</svg>`
  : '';

/* color helpers */
const hex2rgb = h => { h = h.replace('#', ''); if (h.length === 3) h = h.split('').map(c => c + c).join(''); const n = parseInt(h, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
const rgb2hex = a => '#' + a.map(v => Math.round(Math.max(0, Math.min(255, v))).toString(16).padStart(2, '0')).join('');
const lum = h => { const [a, b, c] = hex2rgb(h).map(v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }); return 0.2126 * a + 0.7152 * b + 0.0722 * c; };
const mix = (h, o, t) => { const a = hex2rgb(h), b = hex2rgb(o); return rgb2hex(a.map((v, i) => v + (b[i] - v) * t)); };
function lighten(h, target) { let t = 0, c = h; while (lum(c) < target && t < 1) { t += 0.04; c = mix(h, '#ffffff', t); } return c; }
function darken(h, target) { let t = 0, c = h; while (lum(c) > target && t < 1) { t += 0.04; c = mix(h, '#000000', t); } return c; }
const contrast = (a, b) => { const x = lum(a), y = lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); };
const isDark = () => state.mode === 'dark' || (state.mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);

function applyTheme() {
  const dark = isDark();
  const fill = dark ? lighten(state.accent, 0.18) : state.accent;
  const text = dark ? lighten(state.accent, 0.32) : darken(state.accent, 0.18);
  const on = contrast(fill, '#FFFFFF') >= contrast(fill, '#14161B') ? '#FFFFFF' : '#14161B';
  const s = root.style;
  s.setProperty('--accent', fill);
  s.setProperty('--accent-text', text);
  s.setProperty('--on-accent', on);
  s.setProperty('--r', state.r + 'px');
  const f = FONTS.find(x => x.id === state.font);
  s.setProperty('--display', `${f.d}, ${f.fb}`);
  s.setProperty('--body', `${f.b}, ${f.fb}`);
  root.dataset.btn = state.btn;
  root.dataset.tone = state.tone;
  if (state.mode === 'system') root.removeAttribute('data-theme'); else root.dataset.theme = state.mode;
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (state.mode === 'system') applyTheme(); });

/* board */
const sample = [
  { id: '103', title: 'A student-hosted food pantry', desc: 'A free, stigma-free place to pick up groceries and essentials, hosted by an existing campus office.', div: 'Dining', loc: 'Central campus', scale: 'Large', cost: '$5k+', time: 'Within a year' },
  { id: '112', title: 'Ease peak-hour crowding at Marino', desc: 'Show live capacity and nudge people toward quieter hours so the afternoon rush spreads out.', div: 'Campus Planning', loc: 'Marino Center', scale: 'Medium', cost: '$1k to $5k', time: 'Next semester' }
];
const tab = (id, label, sub, icon) => `<button type="button" class="tab" data-tab="${id}" aria-selected="${state.tab === id}"><strong>${ic(icon)}${label}</strong><span>${sub}</span></button>`;
const pill = (txt, icon, plain) => `<span class="pill${plain ? ' plain' : ''}">${ic(icon)}${txt}</span>`;
function card(p) {
  const v = state.voted.has(p.id);
  return `<article class="card">
    <div class="meta">${pill(p.div, 'tag')}${pill(p.loc, 'pin', true)}</div>
    <h3>${p.title}</h3>
    <p>${p.desc}</p>
    <div class="meta">${pill(p.scale + ' scale', 'layers', true)}${pill(p.cost, 'coins', true)}${pill(p.time, 'clock', true)}</div>
    <div class="card-foot"><button type="button" class="vote" data-vote="${p.id}" aria-pressed="${v}"><span class="token${v ? ' on' : ''}" aria-hidden="true">${ic('check')}</span><span>${v ? 'Voted' : 'Vote'}</span></button></div>
  </article>`;
}
function board() {
  const n = state.voted.size, left = 3 - n;
  const chips = ['All', 'Dining', 'Campus Planning', 'Green Initiatives'].map(d => `<button type="button" class="chip" data-div="${d}" aria-pressed="${state.div === d}">${d}</button>`).join('');
  const tokens = [0, 1, 2].map(i => `<span class="token${i < n ? ' on' : ''}">${ic('check')}</span>`).join('');
  return `
  <h2 class="title">Ideas for campus</h2>
  <p class="lede">Tell SGA what you want to see change. Proposals stay open until Oct 12, then students vote on their favorites.</p>

  <p class="b-label">Period tabs</p>
  <div class="rail" role="tablist">${tab('propose', 'Propose', 'Open until Oct 12', 'pencil')}${tab('vote', 'Vote', 'Oct 13 to Oct 24', 'vote')}${tab('follow', 'Follow', 'Updates all year', 'feed')}</div>

  <p class="b-label">Main prompt</p>
  <button type="button" class="composer"><div><h3>Submit yours!</h3><p>What should be different on campus?</p></div>${state.icons ? `<span class="plus">${ic('plus')}</span>` : ''}</button>

  <p class="b-label">Search and filters</p>
  <div class="toolbar">
    <div class="search">${ic('search')}<input type="search" placeholder="Search proposals" aria-label="Search proposals"></div>
    <div class="chips" role="group" aria-label="Filter by division">${chips}</div>
  </div>

  <p class="b-label">Voting</p>
  <div class="tray"><strong>Your votes</strong><span style="display:flex;gap:8px" aria-hidden="true">${tokens}</span><span class="left" aria-live="polite">${left === 0 ? 'All votes used' : left + ' left'}</span></div>
  <div class="grid">${sample.map(card).join('')}</div>

  <p class="b-label">Progress update</p>
  <article class="post">
    <div class="num"><small>Proposal</small>103</div>
    <div>
      <div class="post-head"><h3>A student-hosted food pantry</h3><span class="status">Development</span></div>
      <p class="update">Began drafting legislation for the pilot program.</p>
      <div class="track" aria-label="Progress: In development"><span class="step done"><span class="dot"></span>Voted</span><span class="bar done"></span><span class="step done"><span class="dot"></span>In development</span><span class="bar"></span><span class="step"><span class="dot"></span>Delivered</span></div>
      <div class="actions">
        <button type="button" class="btn primary" data-follow aria-pressed="${state.follow}">${ic('bell')}${state.follow ? 'Following' : 'Follow this initiative'}</button>
        <button type="button" class="btn" data-contact>${ic('mail')}Contact the committee</button>
      </div>
      <p class="when">Updated 2 days ago</p>
    </div>
  </article>

  <p class="b-label">Proposal form</p>
  <div class="formcard">
    <h3>Propose an initiative</h3>
    <p>Keep it short. SGA will follow up with you if it moves forward.</p>
    <div class="fields">
      <div class="field full"><label for="pf-name">Name</label><input id="pf-name" type="text" placeholder="What would you call it?"></div>
      <div class="field"><label for="pf-loc">Where</label><input id="pf-loc" type="text" placeholder="Building or area"></div>
      <div class="field"><label for="pf-div">Division</label><select id="pf-div"><option>Dining</option><option>Campus Planning</option><option>Green Initiatives</option></select></div>
      <div class="field full"><label for="pf-desc">Description</label><textarea id="pf-desc" placeholder="What is the problem, and what would you change?"></textarea></div>
    </div>
    <div class="formactions"><button type="button" class="btn">Cancel</button><button type="button" class="btn primary">Submit proposal</button></div>
  </div>`;
}

/* panel */
function readout() {
  const f = FONTS.find(x => x.id === state.font);
  return `Corners: ${state.r}px, buttons ${state.btn === 'pill' ? 'pill-shaped' : 'match cards'}
Accent: ${state.accentName} ${state.accent}
Background: ${state.tone}, mode: ${state.mode}
Font: ${f.name}
Icons: ${state.icons ? 'on' : 'off'}`;
}
function syncPanel() {
  $('#r').value = state.r;
  $('#rout').textContent = state.r + 'px';
  $$('[data-set]').forEach(b => {
    const k = b.dataset.set, v = b.dataset.val;
    const cur = k === 'icons' ? (state.icons ? 'on' : 'off') : state[k];
    b.setAttribute('aria-pressed', String(cur === v));
  });
  $$('.sw').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.hex.toLowerCase() === state.accent.toLowerCase() && state.accentName !== 'Custom')));
  $$('.fnt').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.font === state.font)));
  $('#custom').value = state.accent;
  $('#readout').textContent = readout();
}
function render() {
  applyTheme();
  syncPanel();
  const keep = document.activeElement && document.activeElement.id;
  $('#board').innerHTML = board();
  if (keep && $('#' + keep) && $('#board').contains($('#' + keep))) $('#' + keep).focus();
}

$('#swatches').innerHTML = COLORS.map(c => `<button type="button" class="sw" style="--c:${c.hex}" data-hex="${c.hex}" data-name="${c.name}" aria-label="${c.name}" title="${c.name}" aria-pressed="false"></button>`).join('');
$('#fonts').innerHTML = FONTS.map(f => `<button type="button" class="fnt" data-font="${f.id}" aria-pressed="false"><span class="aa" style="font-family:${f.d}, ${f.fb}">Aa</span><span class="nm">${f.name}</span></button>`).join('');

let toastTimer;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2600); }

document.addEventListener('click', async e => {
  const t = e.target.closest('[data-set],.sw,.fnt,[data-tab],[data-div],[data-vote],[data-follow],[data-contact],#copy,#reset,#handle');
  if (!t) return;
  if (t.dataset.set) {
    const k = t.dataset.set, v = t.dataset.val;
    if (k === 'icons') state.icons = v === 'on'; else state[k] = v;
    return render();
  }
  if (t.classList.contains('sw')) { state.accent = t.dataset.hex; state.accentName = t.dataset.name; return render(); }
  if (t.classList.contains('fnt')) { state.font = t.dataset.font; return render(); }
  if (t.dataset.tab) { state.tab = t.dataset.tab; return render(); }
  if (t.dataset.div) { state.div = t.dataset.div; return render(); }
  if (t.dataset.vote) {
    const id = t.dataset.vote;
    if (state.voted.has(id)) state.voted.delete(id); else state.voted.add(id);
    return render();
  }
  if (t.hasAttribute('data-follow')) { state.follow = !state.follow; return render(); }
  if (t.hasAttribute('data-contact')) return toast('Concept only: this would open a message to the committee.');
  if (t.id === 'handle') {
    const open = $('#panel').classList.toggle('open');
    return t.setAttribute('aria-expanded', String(open));
  }
  if (t.id === 'copy') {
    try { await navigator.clipboard.writeText(readout()); toast('Settings copied.'); }
    catch (err) { toast('Copy is blocked here. Select the text above instead.'); }
    return;
  }
  if (t.id === 'reset') { Object.assign(state, DEFAULTS); return render(); }
});
$('#r').addEventListener('input', e => { state.r = Number(e.target.value); render(); });
$('#custom').addEventListener('input', e => { state.accent = e.target.value; state.accentName = 'Custom'; render(); });

render();
</script>
</body>
</html>
