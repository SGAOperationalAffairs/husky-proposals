# Runs the same `npm run verify` as local development (#26), so local and CI never disagree.
# The verify job has no database URL, so database tests skip there on purpose (#104).
# They run in the separate `database` job, the only one that reaches the Neon test branch.
# Its concurrency group makes those jobs run one at a time, which also caps Neon connections.
# Each run still works in its own database, so isolation does not depend on the group.
# A cancelled run (the workflow-level group cancels on every new push) can leave one
# hp_test_ci_* database behind. The harness never sweeps others: reset the branch now and then.
name: verify

on:
  pull_request:
  push:
    branches: [dev, main]

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run verify
      # Saved on every run, pass or fail, so a failure can be read after the fact (#143).
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: neon-test-branch
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:database
        env:
          TEST_DATABASE_URL: ${{ secrets.NEON_TEST_DIRECT_URL }}
          TEST_DATABASE_ALLOWED_HOSTS: ${{ vars.NEON_TEST_HOST }}
          REQUIRE_TEST_DATABASE: "1"
