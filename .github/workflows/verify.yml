# Runs the same `npm run verify` as local development (#26), so local and CI never disagree.
# Database tests (#43) run against the Neon test branch, through two repository secrets.
# Without NEON_TEST_DATABASE_URL, vitest.config.ts fails the run so CI can never pass by skipping.
name: verify

on:
  pull_request:
  push:
    branches: [dev, main]

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run verify
        env:
          DATABASE_URL: ${{ secrets.NEON_TEST_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.NEON_TEST_DIRECT_URL }}
