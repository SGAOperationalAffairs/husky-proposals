# Runs the same `npm run verify` as local development (#26), so local and CI never disagree.
# Database tests join once the Neon test branch exists (T0.4); they will need repository secrets.
name: verify

on:
  pull_request:
  push:
    branches: [dev, main]

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run verify
